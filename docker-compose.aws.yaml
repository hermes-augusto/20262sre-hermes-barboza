services:
  # Camada Analytics: ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: olist_analytics
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Camada Frontend: Streamlit Dashboard
  dashboard:
    build: .
    container_name: olist_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=dashboard
      - CLICKHOUSE_PASSWORD=dashboard
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.headless=true
    depends_on:
      clickhouse:
        condition: service_healthy

  # Camada Worker: Ingestor
  ingestor:
    build: .
    container_name: olist_ingestor
    volumes:
      - ./app:/app
      - ./data:/data
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=ingest
      - CLICKHOUSE_PASSWORD=ingest
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    command: tail -f /dev/null
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
